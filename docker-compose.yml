services:

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"

    volumes:
      - .:/app

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - api

  redis:
    image: redis:7-alpine

    ports:
      - "6379:6379"